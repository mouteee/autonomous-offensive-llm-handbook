<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-labelledby="t d">
<title id="t">The assembled application, as wired</title><desc id="d">One configured run: observations gate the world; the memory store's search assembles budgeted context with omissions recorded; the observation-phase proposal and the plan execute through the dispatch door; capture summaries feed the evidence-phase proposal; verification spends the same model-call meter; surviving findings return to the store as tactics; finish closes the run; the review decision is a separate artifact beside it.</desc>

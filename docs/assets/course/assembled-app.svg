<text x="40" y="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">call sites, in run() order: _start, _observe, _plan,</text>
<text x="40" y="514" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">_proposal_pass (retrieval assembles inside it), _execute, _proposal_pass(evidence),</text>
<text x="40" y="532" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">_execute_rows, _review, _remember, finish -- the store itself opens lazily, at first use</text>
<text x="40" y="556" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">one shared model-call meter spans proposals, repairs and verifier calls; one write boundary</text>
<text x="40" y="574" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">records everything, refusals included</text>
<text x="40" y="604" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">the review decision never reopens the run; examples/app_agent.py is this diagram, executable</text>
</svg>

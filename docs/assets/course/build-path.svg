<text x="453" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">Remember, prove, finish</text>
<text x="453" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="middle" font-weight="normal">lessons 6, 7, 8 and 9</text>
<text x="453" y="166" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal">retrieval, verified findings,</text>

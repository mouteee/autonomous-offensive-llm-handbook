<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 430" width="732" height="430" role="img" aria-labelledby="t d">
<title id="t">The course map: the core route and the optional advanced route</title><desc id="d">Top row, the core build route in order: run and bound (lessons one to three), propose and dispatch (four and five, with a marked detour into lesson ten's contract), remember, prove and finish (six to nine), and assemble (sixteen). Beneath it, the optional advanced route: compare controllers (lessons ten to fifteen), branching from the detour and reconnecting to assembly through the configuration's controller key.</desc>
<rect x="0" y="0" width="732" height="430" rx="10" fill="#1a1a19"/>
<text x="24" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="650">The course map</text>
<text x="24" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#c3c2b7" text-anchor="start" font-weight="normal">core route on top; the controller track is optional</text>
<rect x="24" y="96" width="162" height="96" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="105" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">Run and bound</text>
<text x="105" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="middle" font-weight="normal">lessons 1, 2 and 3</text>
<text x="105" y="166" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal">a reproduced run,</text>
<text x="105" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal">one write boundary</text>
<rect x="198" y="96" width="162" height="96" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="279" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">Propose and dispatch</text>
<text x="279" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="middle" font-weight="normal">lessons 4 and 5</text>
<text x="279" y="166" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal">hypotheses in, six</text>

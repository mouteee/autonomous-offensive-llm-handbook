<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
<title id="t">The candidate-to-feedback loop</title><desc id="d">The host offers eligible candidates; the controller answers with a decision; the policy door re-checks before anything runs; the outcome carries one of the fixed statuses -- clean, tool_error, tool_unavailable, skipped, unresolved, verified_evidence -- and the shared feedback signal, scalarized under the versioned weights, returns to the decision that earned it.</desc>
<rect x="0" y="0" width="960" height="430" rx="10" fill="#1a1a19"/>
<text x="64" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="start" font-weight="650">How an action becomes a learning signal</text>
<text x="64" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">selection is advice; the door is the door; credit is keyed by decision and controller</text>
<rect x="64" y="100" width="190" height="56" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="159" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">eligible candidates</text>
<text x="159" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">host-built, with reasons</text>
<rect x="294" y="100" width="180" height="56" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="384" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">controller.select</text>
<text x="384" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">decision, scores visible</text>
<rect x="514" y="100" width="170" height="56" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="599" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">the policy door</text>
<text x="599" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">re-checked per action</text>
<rect x="724" y="100" width="170" height="56" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="809" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">execute</text>
<text x="809" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">capture or error</text>
<line x1="254" y1="128" x2="288" y2="128" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="474" y1="128" x2="508" y2="128" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="684" y1="128" x2="718" y2="128" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="809" y1="156" x2="809" y2="236" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="639" y="240" width="255" height="62" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="766.5" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">outcome</text>
<text x="766.5" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">status from the fixed vocabulary</text>
<rect x="294" y="240" width="305" height="62" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="446.5" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">shared feedback signal</text>
<text x="446.5" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">components scalarized under feedback-v1</text>
<line x1="635" y1="271" x2="603" y2="271" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="64" y="240" width="190" height="62" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="159" y="264" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">controller.observe</text>
<text x="159" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal">decision-keyed; once</text>
<line x1="290" y1="271" x2="258" y2="271" stroke="#383835" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="159" y1="240" x2="159" y2="160" stroke="#383835" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="64" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="normal">components: duplicate_work, evidence_value, falsification, information_gain, novelty, policy_pressure, resource_cost</text>
<text x="64" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="start" font-weight="normal">statuses: clean, tool_error, tool_unavailable, skipped, unresolved, verified_evidence</text>
<text x="64" y="414" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">a shadow decision, an unexecuted decision, a mis-addressed outcome and a replay all earn nothing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">From an eligible candidate to a recorded outcome</title><desc id="d">Selection is advice: whoever chose the candidate, dispatch re-asks the policy, the recorded gate and stage, and the budgets at the door before the adapter runs. A permitted callback becomes a content-addressed capture and one terminal outcome; every refusal and skip is recorded with its reason; feedback returns to the controller only for executed work.</desc>
<rect x="0" y="0" width="720" height="400" rx="10" fill="#1a1a19"/>
<text x="40" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="650">The dispatch door</text>
<text x="40" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">eligibility, order and permission are three separate decisions</text>
<rect x="40" y="84" width="190" height="58" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="135" y="107" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">candidates</text>
<text x="135" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">eligible, with reasons</text>
<rect x="270" y="84" width="180" height="58" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="360" y="107" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">controller</text>
<text x="360" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">advice, not permission</text>
<rect x="490" y="84" width="190" height="58" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="585" y="107" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">the door</text>
<text x="585" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">policy, gate, stage, budget</text>
<line x1="230" y1="113" x2="266" y2="113" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M 260 109 L 266 113 L 260 117" fill="none" stroke="#898781" stroke-width="1.5"/>
<line x1="450" y1="113" x2="486" y2="113" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M 480 109 L 486 113 L 480 117" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="468" y="107" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal">chosen</text>
<rect x="490" y="196" width="190" height="58" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="585" y="219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">adapter runs</text>
<text x="585" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">fixture callback</text>
<line x1="585" y1="142" x2="585" y2="192" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M 581 186 L 585 192 L 589 186" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="602" y="172" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">admitted</text>
<rect x="270" y="196" width="180" height="58" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="360" y="219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">capture + outcome</text>
<text x="360" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">one terminal status</text>
<line x1="490" y1="225" x2="458" y2="225" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M 460 221 L 454 225 L 460 229" fill="none" stroke="#898781" stroke-width="1.5"/>
<rect x="40" y="196" width="190" height="58" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="135" y="219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="650">feedback</text>
<text x="135" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal">executed work only</text>
<line x1="270" y1="225" x2="238" y2="225" stroke="#898781" stroke-width="1.5" stroke-linecap="butt"/>
<path d="M 240 221 L 234 225 L 240 229" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="40" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">a refusal leaves the door as a recorded reason -- unknown tool, foreign origin, stop gate,</text>
<text x="40" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">wrong stage, spent budget, settled or unresolved identity -- and the adapter never runs for it;</text>
<text x="40" y="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">six outcome words, and none of them blur</text>
<text x="40" y="384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">clean means executed and captured; a security conclusion is a later, human decision</text>
</svg>

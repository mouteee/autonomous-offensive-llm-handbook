<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" role="img" aria-labelledby="t d">
<title id="t">One graph hop, six nodes</title><desc id="d">Two input nodes start active; one hop propagates activation along weighted association edges; the top-k most activated nodes form the active set the fixed readout scores. The edges that joined active nodes are the eligible ones -- the only place this arm's learning applies.</desc>

<text x="64" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">reward grows the solid part and shrinks the pale cap; a context flip refills the caps</text>

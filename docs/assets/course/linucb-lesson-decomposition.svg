<title id="t">LinUCB scores decomposed into prediction and bonus</title><desc id="d">Stacked bar chart over the same eight scripted steps as the score line chart: for each step and family, the solid base is the learned prediction and the pale cap is the uncertainty bonus; their sum is the score. Exact numbers are in data/course/linucb-trace.json.</desc>

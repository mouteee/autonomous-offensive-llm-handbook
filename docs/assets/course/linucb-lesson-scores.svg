<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d">
<title id="t">LinUCB family scores over the scripted lesson</title><desc id="d">Line chart of the linucb score for two families across eight scripted steps; the signal feature flips mid-run and the chosen family per step is marked under the axis. Exact numbers are in data/course/linucb-trace.json.</desc>

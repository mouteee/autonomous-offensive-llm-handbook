<text x="64" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">fam-inject through the episode; credits stack up, penalties stack down, the dot is what competition leaves</text>

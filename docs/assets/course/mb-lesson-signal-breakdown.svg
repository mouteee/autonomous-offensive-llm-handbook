<title id="t">Mushroom-body activation term by term at four steps</title><desc id="d">Signed stacked bars for the injection family at four selected steps of the scripted episode: prior, novelty and the learned readout stack upward, habituation and cost stack downward, a horizontal marker shows their sum before lateral inhibition and a dot shows the activation after it. Exact values are in data/course/mb-trace.json.</desc>

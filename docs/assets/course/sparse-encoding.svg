<path d="M 320 200 L 326 204 L 320 208" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="452" cy="120" r="3.4" fill="#52c78d"/>
<circle cx="466" cy="120" r="3.4" fill="#2c2c2a"/>
<circle cx="480" cy="120" r="3.4" fill="#52c78d"/>

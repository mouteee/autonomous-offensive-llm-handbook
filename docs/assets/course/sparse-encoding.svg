<text x="524" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">active</text>
<text x="40" y="256" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">habituation keys on (surface class, family, signature):</text>
<text x="40" y="274" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">a family erroring on one surface shape is suppressed there, nowhere else</text>
<text x="40" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">no learned weights anywhere on this page; the next lesson adds the one learning site</text>

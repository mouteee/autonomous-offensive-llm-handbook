<line x1="864" y1="142" x2="824" y2="226" stroke="#383835" stroke-width="1.2" stroke-linecap="butt"/>
<text x="64" y="306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">advancement is positional in both vocabularies; the mapping is data the tests hold, not prose</text>

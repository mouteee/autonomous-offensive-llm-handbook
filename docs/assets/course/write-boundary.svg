<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-labelledby="t d">
<title id="t">One write boundary: every state change through one door</title><desc id="d">Each record kind the recorder admits -- action, capture, finding, gate, observation, outcome, review, stage -- enters through the single record call, where validation either appends the record or appends a refusal with its reason. Both land in the same ordered ledger.</desc>
<rect x="0" y="0" width="900" height="422" rx="10" fill="#1a1a19"/>
<text x="64" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="start" font-weight="650">One door, one ledger</text>
<text x="64" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7" text-anchor="start" font-weight="normal">admitted records and refusals are rows in the same ordered event ledger; a refusal is evidence, not an exception</text>
<rect x="64" y="100" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="117" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">action</text>
<line x1="264" y1="113" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="134" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="151" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">capture</text>
<line x1="264" y1="147" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="168" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="185" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">finding</text>
<line x1="264" y1="181" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="202" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">gate</text>
<line x1="264" y1="215" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="236" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="253" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">observation</text>
<line x1="264" y1="249" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="270" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="287" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">outcome</text>
<line x1="264" y1="283" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="304" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="321" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">review</text>
<line x1="264" y1="317" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="64" y="338" width="200" height="26" rx="6" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="164" y="355" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">stage</text>
<line x1="264" y1="351" x2="374" y2="236" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="380" y="206" width="190" height="60" rx="8" fill="none" stroke="#52c78d" stroke-width="1.8"/>
<text x="475" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">record(kind, payload)</text>
<text x="475" y="251" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="normal">run binding, policy, shape</text>
<rect x="660" y="182" width="176" height="108" rx="8" fill="none" stroke="#52c78d" stroke-width="1.5"/>
<text x="748" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="650">ordered event ledger</text>
<text x="748" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="normal">admitted rows</text>
<text x="748" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="normal">refusal rows, with reasons</text>
<line x1="570" y1="224" x2="654" y2="212" stroke="#52c78d" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="570" y1="248" x2="654" y2="260" stroke="#52c78d" stroke-width="1.5" stroke-linecap="butt"/>
<text x="615" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">admit</text>
<text x="615" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">refuse + reason</text>
</svg>
